cat > /tmp/pn-search-index-manual.yaml <<'YAML'
apiVersion: v1
kind: Pod
metadata:
  name: pn-search-index-manual
spec:
  restartPolicy: Never

  initContainers:
    - name: stage-tm-local
      image: docker.io/instrumentisto/rsync-ssh:latest
      imagePullPolicy: Always
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          start=$(date +%s)
          mkdir -p /srv/data/papyri.info/TM
          tar -C /mnt/tm-pvc -cf - . | tar -C /srv/data/papyri.info/TM -xf -
          end=$(date +%s)
          echo "TM stage tar-no-compress: $((end-start))s"
      volumeMounts:
        - name: tm-data-pvc
          mountPath: /mnt/tm-pvc
          readOnly: true
        - name: tm-data-local
          mountPath: /srv/data/papyri.info/TM

    - name: stage-epidoc-local
      image: docker.io/instrumentisto/rsync-ssh:latest
      imagePullPolicy: Always
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          start=$(date +%s)
          mkdir -p /srv/data/papyri.info/git/navigator/epidoc-xslt
          tar -C /mnt/epidoc-pvc -cf - . | tar -C /srv/data/papyri.info/git/navigator/epidoc-xslt -xf -
          end=$(date +%s)
          echo "epidoc stage tar-no-compress: $((end-start))s"
      volumeMounts:
        - name: epidoc-xslt-pvc
          mountPath: /mnt/epidoc-pvc
          readOnly: true
        - name: epidoc-xslt-local
          mountPath: /srv/data/papyri.info/git/navigator/epidoc-xslt
      
    - name: clone-idp-data
      image: docker.io/alpine/git:latest
      imagePullPolicy: Always
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          git clone --depth 1 https://github.com/papyri/idp.data /srv/data/papyri.info/idp.data
      volumeMounts:
        - name: idp-data-work
          mountPath: /srv/data/papyri.info/idp.data
  containers:
    - name: index-job
      image: gitlab-registry.oit.duke.edu/papyri/navigator/tomcat:master
      imagePullPolicy: Always
      env:
        - name: SOLR_URL
          value: "http://solr.dul-papyri-solr-dev:8983/solr/"
      workingDir: /srv/data/papyri.info/git/navigator/pn-indexer
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          lein run
          mkdir -p /mnt/idp-html-pvc
          rsync -rltD --no-owner --no-group --no-perms --omit-dir-times --whole-file --delete /srv/data/papyri.info/pn/idp.html/ /mnt/idp-html-pvc/
      volumeMounts:
        - name: idp-data-work
          mountPath: /srv/data/papyri.info/idp.data
        - name: tm-data-local
          mountPath: /srv/data/papyri.info/TM
        - name: idp-html-local
          mountPath: /srv/data/papyri.info/pn/idp.html
        - name: idp-html-pvc
          mountPath: /mnt/idp-html-pvc
        - name: epidoc-xslt-local
          mountPath: /srv/data/papyri.info/git/navigator/epidoc-xslt
        - name: shared-cron-storage-pvc
          mountPath: /shared

  volumes:
    - name: idp-data-work
      emptyDir: {}
    - name: tm-data-local
      emptyDir: {}
    - name: idp-html-local
      emptyDir: {}
    - name: epidoc-xslt-local
      emptyDir: {}

    - name: tm-data-pvc
      persistentVolumeClaim:
        claimName: tm-data-pvc
    - name: idp-html-pvc
      persistentVolumeClaim:
        claimName: idp-html-pvc
    - name: epidoc-xslt-pvc
      persistentVolumeClaim:
        claimName: epidoc-xslt-pvc
    - name: shared-cron-storage-pvc
      persistentVolumeClaim:
        claimName: shared-cron-storage-pvc
YAML

oc -n dul-papyri-dev apply -f /tmp/pn-search-index-manual.yaml